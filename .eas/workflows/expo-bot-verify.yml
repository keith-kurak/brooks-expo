# Expo bot PR verify
#
# Started by expo-bot-issue.yml on the fix PR it opens, or by an
# "@expo-bot" comment on a pull request (through
# .github/workflows/expo-bot-bridge.yml, which checks out the PR head
# first, so every job here sees the PR's code):
#
#   1. review:   Claude reads the PR diff and posts a code review
#   2. build:    find a fingerprint-matched simulator binary (or build one)
#   3. repack:   inject the PR's JS into that binary; no shared channel,
#                so any number of PRs verify in parallel without conflict
#   4. verify:   an agent drives the repacked app on an EAS cloud simulator
#   5. evidence: screenshots go to EAS Hosting at alias pr-N-evidence
#   6. comment:  review, verdict, and evidence land on the PR
#
# Run by hand from a checkout of the PR branch:
#   eas workflow:run expo-bot-verify.yml -F pr_number=<N>
#
# Env vars required (EAS environment variables, production environment):
#   EXPO_TOKEN_SIMULATOR      personal access token (simulator is actor-gated)
#   CLAUDE_CODE_OAUTH_TOKEN   from `claude setup-token` (or ANTHROPIC_API_KEY)
#   GITHUB_TOKEN              GitHub token with pull-request write access
# Prompts and logic live in tools/agent/ (EAS caps workflow YAML at 16 kB).
# See LLP 0009 for the whole pipeline.
name: Expo bot PR verify

# A new @expo-bot comment on the same PR replaces the run in progress.
concurrency:
  group: ${{ workflow.filename }}-pr-${{ inputs.pr_number }}
  cancel_in_progress: true

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: The pull request number to review and verify
        type: string
        required: true
      instruction:
        description: Optional reviewer guidance (text after @expo-bot in the comment)
        type: string
        default: ""

jobs:
  review:
    name: 1. Review the PR diff
    environment: production
    image: sdk-57
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      GH_REPO: keith-kurak/brooks-expo
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Review the diff and post a comment
        run: |
          set -euo pipefail
          # A numeric test catches every uninterpolated form.
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_number input not interpolated; cannot continue."
            exit 1
          fi
          bash tools/agent/review-pr.sh

  fingerprint:
    name: 2. Fingerprint native code
    type: fingerprint
    # Must match the simulator build profile's environment (eas.json).
    environment: preview

  get_build:
    name: 3. Find matching simulator build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: simulator
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build:
    name: 4. Build iOS simulator (native changed)
    type: build
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    params:
      platform: ios
      profile: simulator
      message: PR ${{ inputs.pr_number }} expo-bot verify

  # A found binary carries the JS it was built with; repack swaps in the
  # PR's JS. A fresh build (above) already has it, so no repack then.
  repack:
    name: 5. Repack with the PR's JS
    type: repack
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build.outputs.build_id }}
      profile: simulator
      message: PR ${{ inputs.pr_number }} expo-bot verify

  verify:
    name: 6. Verify on cloud simulator
    needs: [get_build]
    after: [build, repack]
    environment: production
    image: sdk-57
    env:
      BUILD_ID: ${{ after.build.outputs.build_id || after.repack.outputs.build_id }}
      BUILD_STATUS: ${{ after.build.status }}
      REPACK_STATUS: ${{ after.repack.status }}
      PR_NUMBER: ${{ inputs.pr_number }}
      INSTRUCTION: ${{ inputs.instruction }}
      GH_REPO: keith-kurak/brooks-expo
    outputs:
      evidence_url: ${{ steps.verify.outputs.evidence_url }}
      verdict: ${{ steps.verify.outputs.verdict }}
      verdict_shown: ${{ steps.verify.outputs.verdict_shown }}
    steps:
      - uses: eas/checkout
      # eas-cli reads app.config.ts, which imports expo/config.
      - uses: eas/install_node_modules
      - id: verify
        name: Drive the app, collect evidence, comment
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_number input not interpolated; cannot continue."
            exit 1
          fi
          bash tools/agent/verify-on-simulator.sh

  blocked:
    name: 7. Verification failed
    type: doc
    after: [verify]
    if: ${{ after.verify.status == 'failure' }}
    params:
      md: |
        # 🚫 Verification did not complete

        The run failed before a clean verdict and evidence publish. A status
        comment was posted on the PR; details are in the
        "6. Verify on cloud simulator" job logs.

  report:
    name: 7. Verification report
    type: doc
    needs: [verify]
    params:
      md: |
        # 🤖 Expo bot verification for PR #${{ inputs.pr_number }}

        > ${{ needs.verify.outputs.verdict_shown }}

        - 🖼️ **[Evidence site](${{ needs.verify.outputs.evidence_url }})**: screenshots from the simulator run
        - 💬 The code review and this verdict are comments on the PR.
