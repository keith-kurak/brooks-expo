<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:var(--font-sans,system-ui);color:var(--foreground);margin:0}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;font-size:13px;border:1px solid var(--border);background:transparent;color:var(--foreground);padding:8px 13px;border-radius:8px;cursor:pointer}
button[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
#full{margin-left:auto;color:var(--muted-foreground)}
figure{margin:0}.viewport{width:100%;aspect-ratio:1024/720;overflow:hidden;border-radius:var(--radius,8px)}.viewport.expanded{aspect-ratio:auto}
img{display:block;width:100%;height:auto}
[hidden]{display:none!important}
figcaption{font-size:12px;line-height:1.5;color:var(--muted-foreground);margin-top:10px}
</style></head><body>
<div class="controls" role="group" aria-label="Challenge screenshots"><button id="progress" aria-pressed="true" type="button">In progress</button><button id="complete" aria-pressed="false" type="button">Completed</button><button id="full" aria-pressed="false" type="button">Full screenshot</button></div>
<figure><div class="viewport" id="viewport"><img id="progress-image" src="/Users/nate/.t3/worktrees/brooks-expo/t3-f10e470e/designs/challenges-implementation/01-progress-ios.png" alt="Running app: weekly 5K challenge at 3.2 km, with 1.8 km remaining and two counted runs."><img id="complete-image" src="/Users/nate/.t3/worktrees/brooks-expo/t3-f10e470e/designs/challenges-implementation/02-complete-ios.png" alt="Running app: completed weekly 5K challenge at 5.4 km, with three counted runs and one demo entry earned." hidden></div>
<figcaption>Native iOS app · iPad simulator · test workouts. Cropped to show challenge content; use “Full screenshot” to include navigation.</figcaption></figure>
<script>
const views=['progress','complete'];views.forEach(id=>document.getElementById(id).addEventListener('click',()=>views.forEach(v=>{document.getElementById(v).setAttribute('aria-pressed',String(v===id));document.getElementById(v+'-image').hidden=v!==id})));
document.getElementById('full').addEventListener('click',e=>{const expanded=document.getElementById('viewport').classList.toggle('expanded');e.currentTarget.setAttribute('aria-pressed',String(expanded));e.currentTarget.textContent=expanded?'Crop to content':'Full screenshot'});
</script></body></html>
